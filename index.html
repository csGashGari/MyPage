<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>متجر بسيط</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <h1 class="h3 mb-3">متجر حفصة قشقري</h1>

      <div class="row g-3">
        <div class="col-lg-8">
          <div class="row g-3" id="products"></div>
        </div>

        <div class="col-lg-4">
          <div class="card">
            <div class="card-body">
              <div
                class="d-flex justify-content-between align-items-center mb-2"
              >
                <h2 class="h5 m-0">سلة المشتريات</h2>
                <button class="btn btn-sm btn-outline-danger" id="clearCart">
                  تفريغ
                </button>
              </div>

              <div id="cartItems" class="vstack gap-2"></div>

              <hr />
              <div class="d-flex justify-content-between">
                <span>الإجمالي</span>
                <strong id="total">0 ر.س</strong>
              </div>

              <button class="btn btn-dark w-100 mt-3" id="checkout">
                إتمام الطلب
              </button>
              <div class="text-secondary small mt-2">
                ملاحظة: هذا مثال تعليمي (بدون دفع إلكتروني).
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      ////////////////////////////////////////////
      const PRODUCTS = [
        { id: "p1", name: "1", price: 1, desc: "" },
        { id: "p2", name: "", price: 1, desc: "" },
        { id: "p3", name: "", price: 1, desc: "" },
        { id: "p4", name: "", price: 1, desc: "" },
      ];

      const LS_KEY = "cart_v1";

      function loadCart() {
        try {
          return JSON.parse(localStorage.getItem(LS_KEY)) ?? {};
        } catch {
          return {};
        }
      }

      function saveCart(cart) {
        localStorage.setItem(LS_KEY, JSON.stringify(cart));
      }

      function addToCart(id) {
        const cart = loadCart();
        cart[id] = (cart[id] ?? 0) + 1;
        saveCart(cart);
        renderCart();
      }

      function setQty(id, qty) {
        const cart = loadCart();
        if (qty <= 0) delete cart[id];
        else cart[id] = qty;
        saveCart(cart);
        renderCart();
      }

      function clearCart() {
        localStorage.removeItem(LS_KEY);
        renderCart();
      }

      function moneySAR(x) {
        return `${x} ر.س`;
      }

      function renderProducts() {
        const el = document.getElementById("products");
        el.innerHTML = PRODUCTS.map(
          (p) => `
        <div class="col-md-6">
          <div class="card h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <h3 class="h6 mb-1">${p.name}</h3>
                <span class="fw-semibold">${moneySAR(p.price)}</span>
              </div>
              <p class="text-secondary small mb-3">${p.desc}</p>
              <button class="btn btn-sm btn-primary" onclick="addToCart('${p.id}')">أضف للسلة</button>
            </div>
          </div>
        </div>
      `,
        ).join("");
      }

      function renderCart() {
        const cart = loadCart();
        const itemsEl = document.getElementById("cartItems");
        const totalEl = document.getElementById("total");

        const entries = Object.entries(cart);
        if (entries.length === 0) {
          itemsEl.innerHTML = `<div class="text-secondary">السلة فارغة.</div>`;
          totalEl.textContent = moneySAR(0);
          return;
        }

        let total = 0;
        itemsEl.innerHTML = entries
          .map(([id, qty]) => {
            const p = PRODUCTS.find((x) => x.id === id);
            if (!p) return "";
            const line = p.price * qty;
            total += line;

            return `
          <div class="border rounded p-2 bg-white">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <div class="fw-semibold">${p.name}</div>
                <div class="text-secondary small">${moneySAR(p.price)} للقطعة</div>
              </div>

              <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary" onclick="setQty('${id}', ${qty - 1})">-</button>
                <span class="px-2">${qty}</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="setQty('${id}', ${qty + 1})">+</button>
                <button class="btn btn-sm btn-outline-danger" onclick="setQty('${id}', 0)">حذف</button>
              </div>
            </div>

            <div class="text-end text-secondary small mt-1">المجموع: ${moneySAR(line)}</div>
          </div>
        `;
          })
          .join("");

        totalEl.textContent = moneySAR(total);
      }

      document.getElementById("clearCart").addEventListener("click", clearCart);
      document.getElementById("checkout").addEventListener("click", () => {
        const cart = loadCart();
        if (Object.keys(cart).length === 0) return alert("السلة فارغة.");
        alert("تم (افتراضياً) إرسال الطلب! يمكنك ربطه بصفحة دفع لاحقاً.");
      });

      renderProducts();
      renderCart();
    </script>
  </body>
</html>
